<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy rounded square background — matches the profile app icon on the desktop -->
  <rect width="32" height="32" rx="7" fill="#2F4156"/>
  <!-- Subtle grid lines like the site background -->
  <line x1="8" y1="0" x2="8" y2="32" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <line x1="16" y1="0" x2="16" y2="32" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <line x1="24" y1="0" x2="24" y2="32" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <line x1="0" y1="8" x2="32" y2="8" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <line x1="0" y1="16" x2="32" y2="16" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <line x1="0" y1="24" x2="32" y2="24" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <!-- B in white, C in sky blue — matches the nav logo style -->
  <text x="3" y="22" font-family="Arial Black, sans-serif" font-size="17" font-weight="900" fill="#F5EFEB">B</text>
  <text x="16" y="22" font-family="Arial Black, sans-serif" font-size="17" font-weight="900" fill="#4A78A8">C</text>
</svg>
